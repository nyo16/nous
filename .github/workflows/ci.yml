name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MIX_ENV: test
  ELIXIR_VERSION: "1.18.3"
  OTP_VERSION: "27.2"

jobs:
  compile:
    name: Compile & Warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps & build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - run: mix deps.get
      - run: mix deps.compile

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps
        uses: actions/cache@v5
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - run: mix deps.get
      - run: mix format --check-formatted
      # Fail if mix.lock carries entries no longer referenced by mix.exs —
      # stale locks silently pin (and block updates of) transitive deps.
      - run: mix deps.unlock --check-unused

  credo:
    name: Credo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps & build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - run: mix deps.get
      - run: mix credo --strict

  deps_audit:
    name: Deps Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps & build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - run: mix deps.get
      # deps.audit is a Mix task shipped by the mix_audit dep, so the dep must
      # be compiled before the task exists.
      - run: mix deps.compile

      # Retired-package check (built into Hex): fails if mix.lock pins a
      # package version its maintainers have retired on hex.pm.
      - run: mix hex.audit

      # Known-vulnerability scan of mix.lock against the GitHub-sourced
      # advisory DB (mirego/elixir-security-advisories).
      #
      # Ignored advisory — one cowlib issue with NO patched release:
      #   EEF-CVE-2026-43966  structured-fields header CRLF injection
      #                       (cow_http_struct_hd response splitting; GitHub
      #                       mirror id GHSA-w4f7-4cxr-rv3c, ignored under
      #                       both ids). Fixed upstream in ninenines/cowlib
      #                       4401b85, which landed after the 2.21.0 tag.
      # cowlib 2.21.0 fixed EEF-CVE-2026-43969 (cookie request-header
      # injection), so that ignore is gone.
      # Exposure is test-only: cowlib reaches this project exclusively through
      # bypass -> plug_cowboy -> cowboy, and bypass is `only: :test` (see
      # mix.exs, whose `hex: [ignore_advisories: ...]` carries the same id
      # for the `mix hex.audit` step above). Drop this ignore as soon as a
      # patched cowlib release exists and the lock is bumped. Never add a
      # runtime dependency here — that is what this gate exists to catch.
      - name: Audit dependencies for known vulnerabilities
        run: >-
          mix deps.audit
          --ignore-advisory-ids
          EEF-CVE-2026-43966,GHSA-w4f7-4cxr-rv3c

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps & build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-docs-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-docs-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - run: mix deps.get
        env:
          MIX_ENV: dev

      # ex_doc only runs in :dev. `--warnings-as-errors` (ex_doc >= 0.34) turns
      # autolink drift into a build failure: a `@moduledoc false` module that is
      # still referenced from a guide, or an `extras:` entry pointing at a file
      # that moved, both warn here and nowhere else.
      - name: Build docs with warnings as errors
        run: mix docs --warnings-as-errors
        env:
          MIX_ENV: dev

  test:
    name: Tests (${{ matrix.os }} / OTP ${{ matrix.otp }} / Elixir ${{ matrix.elixir }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            elixir: "1.18.3"
            otp: "27.2"
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Cache deps & build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      - run: mix deps.get
      - run: mix deps.compile
      - run: mix compile
      - run: mix test
      # The optional-dependency backends (SQLite, DuckDB, PromEx) are
      # declared `optional: true` in mix.exs, so they compile and run in the
      # step above too; this leg names them so a future default exclusion of
      # the tags — or a NIF that stops building on one matrix OS — is a
      # visible red rather than a silent skip. Before this, the modules were
      # `if Code.ensure_loaded?` ghosts that never compiled in-repo.
      - name: Optional-dependency backends
        run: mix test --only sqlite --only duckdb --only prom_ex

  # The suite against the NEWEST versions mix.exs admits, not the lock. A
  # consumer's resolver picks those, so CI that only ever tests mix.lock is how
  # net_runner 1.4.0 (which rejected Bash's flat cgroup path) shipped
  # unnoticed (audit Deps M2, issue #84). No cache: a restored deps/_build
  # would be built against the locked versions.
  test_newest_deps:
    name: Tests (newest admitted deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - run: mix deps.unlock --all
      - run: mix deps.get
      - name: Resolved versions
        run: mix deps | grep -E '^\* (net_runner|hackney|mint|req|finch|ecto|decimal) '
      - run: mix deps.compile
      - run: mix compile --warnings-as-errors
      - run: mix test

  # Bash's cgroup-v2 confinement (`net_runner/nous_bash_<n>`) is only taken on
  # a Linux host with a writable cgroup v2 root. The runner's user cannot
  # write /sys/fs/cgroup, root can — so build as the runner user and run just
  # the tagged tests under sudo. `--only` fails when no test ran, so a host
  # where the compile-time gate in bash_cgroup_integration_test.exs compiles
  # the test out is a red build, not a silent skip. Runs against both the
  # lock and the newest admitted net_runner.
  cgroup_integration:
    name: Bash cgroup confinement (${{ matrix.deps }} net_runner)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        deps: [locked, newest]
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - if: matrix.deps == 'newest'
        run: mix deps.unlock net_runner
      - run: mix deps.get
      - run: mix deps | grep -E '^\* net_runner '
      - run: mix deps.compile
      - run: mix compile
      - name: cgroup integration tests (as root)
        run: sudo --preserve-env env "PATH=$PATH" mix test --only cgroup_integration

  # mix.exs admits Elixir ~> 1.18, and OTP 28 is current. On that pair a
  # compiled regex cannot be escaped into a module attribute, which made 0.18.1
  # fail to compile entirely (input_guard/strategies/pattern.ex) while the
  # OTP 27 matrix stayed green. Full suite, not just compile: regexes that
  # compile can still misbehave at runtime.
  test_otp28:
    name: Tests (Elixir 1.18 / OTP 28)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "28"

      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps & build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - run: mix deps.get
      - run: mix deps.compile
      - run: mix compile

      # Built-in ExUnit cover tool — no extra dependency. The threshold lives
      # in `test_coverage:` in mix.exs, so `mix test --cover` behaves the same
      # here and on a laptop.
      #
      # The floor is a RATCHET, not a target: it is set to coverage we already
      # have (57%, measured), so the gate passes on day one and only ever
      # catches regressions. A gate that fails the day you add it gets
      # disabled the day after. Raise the number in mix.exs as coverage
      # improves; never lower it to turn a red build green.
      - name: Tests with coverage threshold
        run: mix test --cover

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps & build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - name: Cache PLTs
        uses: actions/cache@v5
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - run: mix deps.get
      - run: mix deps.compile
      - run: mix compile
      - run: mix dialyzer

  publish:
    name: Publish to Hex
    runs-on: ubuntu-latest
    needs:
      [
        compile,
        format,
        credo,
        deps_audit,
        docs,
        test,
        test_newest_deps,
        test_otp28,
        cgroup_integration,
        coverage,
        dialyzer
      ]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Set version from tag
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          sed -i "s/@version \".*\"/@version \"${TAG_VERSION}\"/" mix.exs
          grep '@version' mix.exs

      - run: mix deps.get
        env:
          MIX_ENV: dev
      - run: mix compile
        env:
          MIX_ENV: dev

      - name: Publish to Hex
        run: mix hex.publish --yes
        env:
          MIX_ENV: dev
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}

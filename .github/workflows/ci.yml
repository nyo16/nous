name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MIX_ENV: test
  ELIXIR_VERSION: "1.18.3"
  OTP_VERSION: "27.2"

jobs:
  compile:
    name: Compile & Warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps & build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - run: mix deps.get
      # Prune deps/ and _build/ entries no longer in mix.lock. These jobs
      # restore a cache, and `mix deps.get` only ADDS — so a dep dropped from
      # mix.exs lingers in the cache forever, gets recompiled, and can still be
      # loaded. `mix deps.unlock --check-unused` (format job) gates the lock;
      # this prunes the directories the lock no longer mentions.
      - run: mix deps.clean --unused
      - run: mix deps.compile

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps
        uses: actions/cache@v5
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - run: mix deps.get
      - run: mix deps.clean --unused
      - run: mix format --check-formatted
      # Fail if mix.lock carries entries no longer referenced by mix.exs —
      # stale locks silently pin (and block updates of) transitive deps.
      - run: mix deps.unlock --check-unused

  credo:
    name: Credo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps & build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - run: mix deps.get
      - run: mix deps.clean --unused
      - run: mix credo --strict

  test:
    name: Tests (${{ matrix.os }} / OTP ${{ matrix.otp }} / Elixir ${{ matrix.elixir }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            elixir: "1.18.3"
            otp: "27.2"
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Cache deps & build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      # `Nous.Tools.EnvTest`'s FileGrep child-environment assertion and its
      # paired control both skip without ripgrep, so the scrubbing proof for one
      # of the three subprocess spawn sites had never run in CI at all.
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - run: mix deps.get
      - run: mix deps.clean --unused
      - run: mix deps.compile
      - run: mix compile
      # `mix compile --warnings-as-errors` (the `compile` job) never sees
      # `test/**/*_test.exs`: elixirc_paths(:test) stops at "lib" + "test/support"
      # and ExUnit loads the test files at run time. Without the flag here, a
      # test asserting a contract the code does not have warns forever and
      # fails nothing. `--warnings-as-errors` on `mix test` (Elixir >= 1.12)
      # covers exactly those files.
      - run: mix test --warnings-as-errors

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps & build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      # Same reason as the test job: without rg, two of the tests this job's
      # coverage number is computed from do not execute.
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - run: mix deps.get
      - run: mix deps.clean --unused
      - run: mix deps.compile
      - run: mix compile

      # Built-in ExUnit cover tool — no extra dependency. The threshold lives
      # in `test_coverage:` in mix.exs, so `mix test --cover` behaves the same
      # here and on a laptop.
      #
      # The floor is a RATCHET, not a target: it is set to coverage we already
      # have, so the gate passes on day one and only ever catches regressions. A
      # gate that fails the day you add it gets disabled the day after. The
      # number and the reasoning for `ignore_modules` live in mix.exs — raise it
      # as coverage improves; never lower it to turn a red build green.
      - name: Tests with coverage threshold
        run: mix test --cover

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps & build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - name: Cache PLTs
        uses: actions/cache@v5
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - run: mix deps.get
      - run: mix deps.clean --unused
      - run: mix deps.compile
      - run: mix compile
      - run: mix dialyzer

  optional-deps:
    name: Optional deps (compile canary)
    runs-on: ubuntu-latest
    # Deliberately absent from `publish.needs` and required by nothing: this job
    # compiles the `Code.ensure_loaded?`-gated arms the default build never sees
    # (see `optional_backend_deps/0` in mix.exs), and `duckdbex` builds DuckDB
    # from source, so its wall-clock is unpredictable. It is a canary — visible
    # when it goes red, never able to block a release. `continue-on-error` is
    # deliberately NOT set: a canary nobody can see is theatre.
    env:
      MIX_OPTIONAL_DEPS: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      # Its own cache namespace: this tree holds the optional deps, and sharing a
      # key with the other jobs would leak them into the jobs whose whole job is
      # to prove the code compiles WITHOUT them. mix.lock is not authoritative
      # here — the optional deps are resolved fresh and never locked — so the key
      # carries mix.exs too.
      - name: Cache deps & build (optional-deps tree)
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-optional-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.exs', 'mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-optional-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      # duckdbex compiles DuckDB from source. ubuntu-latest already ships
      # build-essential and cmake; this pins that rather than inheriting it.
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake

      - run: mix deps.get
      - run: mix deps.compile

      # If a dep did not become loadable, the placeholder arm compiled instead
      # and this whole job proves nothing. Assert the precondition before
      # believing the compile. (`Muninn`/`Zvec` are deliberately not here — see
      # `optional_backend_deps/0` in mix.exs for the measurement.)
      - name: Assert every optional dep is loadable
        run: |
          mix run --no-start -e '
            for mod <- [Duckdbex, Bumblebee, PromEx] do
              Code.ensure_loaded?(mod) ||
                raise "#{inspect(mod)} is not loadable — the arm it gates was NOT compiled"
            end
          '

      # --force so a restored _build cannot skip the arms, and
      # --warnings-as-errors because a drifted optional-dep API shows up as an
      # undefined remote call: a warning that fails nothing is exactly how
      # `Nous.Memory.Store.SQLite` shipped broken against every `exqlite` its own
      # constraint allowed. No tests here: these deps are heavy and unpinned, and
      # a canary that flakes gets ignored.
      - name: Compile every optional arm
        run: mix compile --force --warnings-as-errors

  publish:
    name: Publish to Hex
    runs-on: ubuntu-latest
    needs: [compile, format, credo, test, coverage, dialyzer]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Set version from tag
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          sed -i "s/@version \".*\"/@version \"${TAG_VERSION}\"/" mix.exs
          grep '@version' mix.exs

      - run: mix deps.get
        env:
          MIX_ENV: dev
      - run: mix compile
        env:
          MIX_ENV: dev

      - name: Publish to Hex
        run: mix hex.publish --yes
        env:
          MIX_ENV: dev
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
